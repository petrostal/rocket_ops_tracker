name: opstracker

services:
  tasks-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tasks-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tasks-internal]

  tasks-backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD}@tasks-postgres:5432/${POSTGRES_DB:-tasks}
      ATTACHMENTS_DIR: /data/attachments
    volumes:
      - tasks-attachments-data:/data/attachments
    depends_on:
      tasks-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [tasks-internal, traefik]

  tasks-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD}@tasks-postgres:5432/${POSTGRES_DB:-tasks}
    depends_on:
      tasks-backend:
        condition: service_healthy
    networks: [tasks-internal, traefik]

  tasks-frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      ALLOWED_FRAME_ORIGIN: ${ALLOWED_FRAME_ORIGIN:-'none'}
      CSP_EXTERNAL_IMAGE_SOURCES: ${CSP_EXTERNAL_IMAGE_SOURCES:-}
    depends_on:
      tasks-backend:
        condition: service_healthy
    ports:
      - "${TASKS_BIND_ADDRESS:-127.0.0.1}:${TASKS_HTTP_PORT:-8088}:8080"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:?TRAEFIK_NETWORK is required}"
      traefik.http.routers.opstracker.rule: "Host(`${TASKS_DOMAIN:?TASKS_DOMAIN is required}`)"
      traefik.http.routers.opstracker.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.opstracker.tls: "true"
      traefik.http.routers.opstracker.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.opstracker.loadbalancer.server.port: "8080"
    networks: [tasks-internal, traefik]

volumes:
  tasks-postgres-data:
  tasks-attachments-data:

networks:
  tasks-internal:
    internal: true
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?TRAEFIK_NETWORK is required}
